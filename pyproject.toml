[tool.nitpick]
style = "https://raw.githubusercontent.com/wemake-services/wemake-python-styleguide/master/styles/nitpick-style.toml"

[tool.flakehell]
base = "https://raw.githubusercontent.com/life4/flakehell/master/pyproject.toml"
baseline = ".flakehell_baseline"

[tool.black]
line-length = 120
target-version = ['py39']
include = '\.pyi?$'
exclude = '''
(
  /(
      \.eggs         # exclude a few common directories in the
    | \.git          # root of the project
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
  )/
  | foo.py           # also separately exclude a file named foo.py in
                     # the root of the project
)
'''

[tool.bumpver]
current_version = "2025.09.0"
version_pattern = "YYYY.0M.PATCH"
commit_message = "bump version to {old_version} -> {new_version}"
tag_message = "v{new_version}"
commit = true
tag = true
push = false

[tool.bumpver.file_patterns]
"fairq_data_cams/__init__.py" = [
    "{version}",
]
