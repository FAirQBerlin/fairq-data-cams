[project]
name = "fairq-data-cams"
version = "2026.05.0"
description = "Module that processes CAMS data"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cdsapi==0.7.7",
    "cfgrib==0.9.15.1",
    "clickhouse-driver==0.2.10",
    "eccodes==2.47.0",
    "glob2==0.7.0",
    "netcdf4==1.7.4",
    "numpy>=2.2.6",
    "pandas==2.3.3",
    "python-dateutil==2.9.0.post0",
    "python-dotenv==1.2.2",
    "requests==2.33.1",
    "wget==3.2.0",
    "xarray==2025.6.1",
]

[dependency-groups]
dev = [
    "mypy==1.20.2",
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "bumpver==2025.1131",
    "types-python-dateutil>=2.9.0.20260508",
    "ruff>=0.15.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.nitpick]
style = "https://raw.githubusercontent.com/wemake-services/wemake-python-styleguide/master/styles/nitpick-style.toml"

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.bumpver]
current_version = "2025.09.0"
version_pattern = "YYYY.0M.PATCH"
commit_message = "bump version to {old_version} -> {new_version}"
tag_message = "v{new_version}"
commit = true
tag = true
push = false

[tool.bumpver.file_patterns]
"fairq_data_cams/__init__.py" = [
    "{version}",
]
